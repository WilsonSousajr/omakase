# Limits are the targets from the start: this code is born under the gate
# (spec, Testing and the Apple gate). --strict makes every warning fail.
included: [Packages, OmakaseMac]
excluded: [Packages/OmakaseAPI/.build, Packages/OmakaseStore/.build, Packages/OmakaseFeatures/.build, .tools]
disabled_rules: [trailing_comma]  # swift-format owns commas
function_body_length: {warning: 20, error: 40}
cyclomatic_complexity: {warning: 10, error: 20}
nesting: {type_level: 2, function_level: 2}
file_length: {warning: 500, error: 800}
custom_rules:
  no_print:
    regex: '\bprint\('
    message: "Logging only (AGENTS.md Logging): use Logger, never print"
    severity: warning
  raw_animation:
    regex: 'withAnimation\(|\.animation\('
    excluded: ".*Design/Motion\\.swift"
    message: "Only Design/Motion.swift may animate directly, so Reduce Motion (spec §2/§10) is never bypassed - route through Motion.resolved/.perform/.motion(...)."
    severity: warning
  raw_glass_button:
    regex: 'buttonStyle\(\.glass(Prominent)?\)'
    message: "use .secondary / .icon (Design/Buttons.swift) — one shape family, glass-pass §1"
    severity: warning
