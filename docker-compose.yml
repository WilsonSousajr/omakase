# Requires .env file — copy .env.example and fill in values
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omakase}
      POSTGRES_USER: ${POSTGRES_USER:-omakase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omakase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-${GOOGLE_CLIENT_ID:-}}
      # tools/tests/test_gate_workflow.py reads the CI workflow and pre-commit
      # config, which live outside backend/ (#66).
      REPO_ROOT: /repo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./.github:/repo/.github:ro
      - ./.pre-commit-config.yaml:/repo/.pre-commit-config.yaml:ro
      # Read-write: tools/tests/test_contract_fixtures.py writes them (#78).
      # Read-only for the Apple gate's workflow and coverage-gate tests (#85);
      # the Fixtures mount below stays read-write on top of it.
      - ./apps/apple:/repo/apps/apple:ro
      - ./apps/apple/Fixtures:/repo/apps/apple/Fixtures
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
