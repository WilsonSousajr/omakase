name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test -- --coverage --coverage.thresholds.lines=50
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omakase_test
          POSTGRES_USER: omakase
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://omakase:testpassword@localhost:5432/omakase_test
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "True"
      GOOGLE_CLIENT_ID: test-google-client-id-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py migrate --noinput
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=60

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend prod image
        run: docker build --target prod -t omakase-frontend:prod ./frontend
      - name: Build backend prod image
        run: docker build --target prod -t omakase-backend:prod ./backend
        env:
          DJANGO_SECRET_KEY: build-only-not-runtime
      - name: Verify frontend image size under 500MB
        run: |
          SIZE=$(docker image inspect omakase-frontend:prod --format='{{.Size}}')
          MAX=$((500 * 1024 * 1024))
          echo "Frontend image size: $((SIZE / 1024 / 1024))MB"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "FAIL: Frontend image exceeds 500MB threshold"
            exit 1
          fi
