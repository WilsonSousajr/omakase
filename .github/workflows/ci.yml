name: CI
on:
  push:
    branches: [main, develop]
  # Every PR, whatever its base, as in omatty: a stacked PR targets another
  # feature branch, and filtering on main/develop left the stack unchecked.
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact, not "3.12", and the same as backend/Dockerfile's base image: a
  # floating minor resolves to the newest patch, so CI and the container would
  # drift apart silently. tools/tests/test_gate_workflow.py asserts they match.
  PYTHON_VERSION: "3.12.14"

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  # Named as in omatty. Required status checks on protected branches refer to
  # it by this name, so renaming it is a branch-protection change too.
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omakase_test
          POSTGRES_USER: omakase
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://omakase:testpassword@localhost:5432/omakase_test
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "True"
      GOOGLE_CLIENT_ID: test-google-client-id-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      # Cognitive complexity - what nesting costs a reader - is omatty's gocognit,
      # and the check behind AGENTS.md's "at most 2 levels of indentation".
      # 28 is a ratchet at today's worst (Task.save, StudyBlock.save); target 15.
      - run: complexipy accounts tasks pomodoro study stats omakase idempotency -e "**/tests/**" -e "**/migrations/**" -q --max-complexity-allowed 28
      - run: python manage.py check --fail-level WARNING
      # The schema is tidy: every model change has its migration. The Django
      # counterpart of omatty's `go mod tidy -diff`.
      - run: python manage.py makemigrations --check --dry-run
      # Needs the network, like omatty's govulncheck; pinned for the same
      # reason - a scanner that changes under you reports different things on
      # different days.
      - run: pip-audit -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: pytest --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90
      # Straight after the coverage step, so it reuses the coverage.json that
      # step just wrote; crapcheck refuses a report older than the source.
      # 18 is a ratchet at today's worst (Task.save, 17.6); target 12.
      - run: python -m tools.crapcheck --threshold 18 --report coverage.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend prod image
        run: docker build --target prod -t omakase-backend:prod ./backend
        env:
          DJANGO_SECRET_KEY: build-only-not-runtime

  # The Apple gate (apps/apple/gate.sh), same steps in the same order. Tools
  # are pinned in apps/apple/tools.env; the runner's Xcode is selected exactly.
  apple-gate:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "/Applications/Xcode_$(grep XCODE_VERSION tools.env | cut -d= -f2).app"
      - run: ./install-tools.sh && echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - run: swift format lint --strict --recursive Packages OmakaseMac
      - run: swiftlint lint --strict --quiet
      - run: ./check-layers.sh
      - run: ./test-packages.sh
      - run: xcodegen generate --quiet
      - run: xcodebuild -project Omakase.xcodeproj -scheme OmakaseMac -destination platform=macOS CODE_SIGNING_ALLOWED=NO -quiet build
