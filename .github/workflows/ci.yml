name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact, not "3.12", and the same as backend/Dockerfile's base image: a
  # floating minor resolves to the newest patch, so CI and the container would
  # drift apart silently. tools/tests/test_gate_workflow.py asserts they match.
  PYTHON_VERSION: "3.12.14"

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omakase_test
          POSTGRES_USER: omakase
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://omakase:testpassword@localhost:5432/omakase_test
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_DEBUG: "True"
      GOOGLE_CLIENT_ID: test-google-client-id-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: python manage.py check --fail-level WARNING
      # The schema is tidy: every model change has its migration. The Django
      # counterpart of omatty's `go mod tidy -diff`.
      - run: python manage.py makemigrations --check --dry-run
      # Needs the network, like omatty's govulncheck; pinned for the same
      # reason - a scanner that changes under you reports different things on
      # different days.
      - run: pip-audit -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend prod image
        run: docker build --target prod -t omakase-backend:prod ./backend
        env:
          DJANGO_SECRET_KEY: build-only-not-runtime
