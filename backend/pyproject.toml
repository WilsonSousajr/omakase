[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "omakase.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["tasks", "pomodoro"]
omit = ["*/migrations/*", "*/admin.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
